# SPDX-License-Identifier: GPL-2.0-only
# Builds, tests and packages every plugin and uploads the packages as workflow
# artifacts. It publishes nothing: run it by hand to get the binaries of any
# branch or commit. draft-release calls it and attaches the same packages.
# The label (the release tag, or the short commit hash) is also the version
# string the plugins report (core.nss.Version()).
name: package

on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Name part of the packages (nssfactory-<label>-<platform>); the short commit hash if empty'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      label:
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  PKG_LABEL: ${{ inputs.label }}

jobs:
  # Linux CPU packages, both for Ubuntu 24.04 or later: x86-64 needs glibc
  # 2.34 and the libstdc++ of GCC 13; arm64 is built with the NEON release
  # toolchain (GCC 15), needs glibc 2.38 and carries its libstdc++ statically
  # (the system's on Ubuntu 24.04 is older than GCC 15's).
  build-linux:
    name: build-linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            mode: dynamic
            cc: gcc
            cxx: g++
            link: ''
          - arch: arm64
            runner: ubuntu-24.04-arm
            mode: neon
            cc: gcc-15
            cxx: g++-15
            ppa: ppa:ubuntu-toolchain-r/test
            link: -static-libstdc++ -static-libgcc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: release-ccache-linux-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: release-ccache-linux-${{ matrix.arch }}-
      - name: packages
        run: |
          if [ -n "${{ matrix.ppa }}" ]; then sudo add-apt-repository -y "${{ matrix.ppa }}"; fi
          sudo apt-get update
          sudo apt-get install -y cmake git ccache python3-venv ${{ matrix.cxx }}
          python3 -m venv .vsenv
          .vsenv/bin/pip install vapoursynth numpy scipy
          echo "VapourSynth_INCLUDE_DIR=$(.vsenv/bin/python -c "import vapoursynth, pathlib; print(pathlib.Path(vapoursynth.__file__).parent / 'include')")" >> "$GITHUB_ENV"
      - name: package label
        shell: bash
        run: echo "PKG_LABEL=${PKG_LABEL:-${GITHUB_SHA::7}}" >> "$GITHUB_ENV"
      - name: configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DNSS_HWY_TARGET_MODE=${{ matrix.mode }} \
            -DCMAKE_SHARED_LINKER_FLAGS="${{ matrix.link }}" \
            -DNSS_GIT_DESCRIBE="$PKG_LABEL" \
            -DVapourSynth_INCLUDE_DIR="$VapourSynth_INCLUDE_DIR" \
            -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.vsenv/bin/python"
      - name: build
        run: cmake --build build -j
      - name: unit tests
        run: ctest --test-dir build --output-on-failure
      - name: plugin gate must execute
        # ctest counts a skip (77) as a pass; the package needs the gate to run.
        run: |
          ctest --test-dir build -R '^test_full_image_plugin$' -V | tee full-image.log
          grep -q 'NSS_GATE_COMPLETED.*"passed": true' full-image.log
      - name: host smoke (default + temporal + explicit parameters)
        run: .vsenv/bin/python tests/smoke_defaults.py
        env:
          NSS_SO: ${{ github.workspace }}/build/libnss.so
      - name: parameter bounds probe
        run: .vsenv/bin/python tests/test_parameter_bounds_plugin.py
        env:
          NSS_SO: ${{ github.workspace }}/build/libnss.so
      - name: runtime dependencies
        run: |
          objdump -p build/libnss.so | grep NEEDED
          objdump -T build/libnss.so | grep -oE 'GLIBC_[0-9.]+|GLIBCXX_[0-9.]+' | sort -uV | tail -4
          if [ -n "${{ matrix.link }}" ] && objdump -p build/libnss.so | grep -q 'NEEDED.*libstdc++'; then
            echo "libstdc++ should be linked statically"; exit 1
          fi
      - name: package
        run: |
          pkg="nssfactory-${PKG_LABEL}-linux-${{ matrix.arch }}"
          mkdir -p "pkg/$pkg/docs"
          cp build/libnss.so README.md LICENSE NOTICE "pkg/$pkg/"
          cp -r docs/api "pkg/$pkg/docs/"
          tar -C pkg -czf "$pkg.tar.gz" "$pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: nssfactory-*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: release-ccache-macos-${{ github.sha }}
          restore-keys: release-ccache-macos-
      - name: packages
        run: |
          brew install ccache
          python3 -m venv .vsenv
          .vsenv/bin/pip install vapoursynth numpy scipy
          echo "VapourSynth_INCLUDE_DIR=$(.vsenv/bin/python3 -c "import vapoursynth, pathlib; print(pathlib.Path(vapoursynth.__file__).parent / 'include')")" >> "$GITHUB_ENV"
      - name: package label
        shell: bash
        run: echo "PKG_LABEL=${PKG_LABEL:-${GITHUB_SHA::7}}" >> "$GITHUB_ENV"
      - name: configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DNSS_HWY_TARGET_MODE=neon \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 \
            -DNSS_GIT_DESCRIBE="$PKG_LABEL" \
            -DVapourSynth_INCLUDE_DIR="$VapourSynth_INCLUDE_DIR" \
            -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.vsenv/bin/python3"
      - name: build
        run: cmake --build build -j
      - name: unit tests
        run: ctest --test-dir build --output-on-failure
      - name: plugin gate must execute
        run: |
          ctest --test-dir build -R '^test_full_image_plugin$' -V | tee full-image.log
          grep -q 'NSS_GATE_COMPLETED.*"passed": true' full-image.log
      - name: host smoke (default + temporal + explicit parameters)
        run: .vsenv/bin/python3 tests/smoke_defaults.py
        env:
          NSS_SO: ${{ github.workspace }}/build/libnss.dylib
      - name: parameter bounds probe
        run: .vsenv/bin/python3 tests/test_parameter_bounds_plugin.py
        env:
          NSS_SO: ${{ github.workspace }}/build/libnss.dylib
      - name: minimum macOS
        # The runner's own macOS otherwise becomes the minimum; 13.3 is what
        # the VapourSynth wheels require.
        run: |
          vtool -show-build build/libnss.dylib | tee build-version.txt
          grep -qE 'minos 13\.3$' build-version.txt || { echo "libnss.dylib should need macOS 13.3"; exit 1; }
      - name: package
        run: |
          test -f build/libnss.dylib
          pkg="nssfactory-${PKG_LABEL}-macos-arm64"
          mkdir -p "pkg/$pkg/docs"
          cp build/libnss.dylib README.md LICENSE NOTICE "pkg/$pkg/"
          cp -r docs/api "pkg/$pkg/docs/"
          tar -C pkg -czf "$pkg.tar.gz" "$pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: nssfactory-*-macos-arm64.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: release-ccache-windows-${{ github.sha }}
          restore-keys: release-ccache-windows-
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: packages
        run: |
          choco install ccache llvm ninja --no-progress
          pip install vapoursynth numpy scipy
      - name: verify clang++ target
        shell: powershell
        run: |
          clang++ --version
          $target = (clang++ -print-target-triple).Trim()
          Write-Host "clang++ target: $target"
          if ($target -notmatch "windows-msvc") {
            throw "Expected an MSVC-targeted clang++, got '$target'"
          }
      - name: package label
        shell: bash
        run: echo "PKG_LABEL=${PKG_LABEL:-${GITHUB_SHA::7}}" >> "$GITHUB_ENV"
      - name: configure
        run: |
          $vsInclude = python -c "import vapoursynth, pathlib; print(pathlib.Path(vapoursynth.__file__).parent / 'include')"
          $pythonExe = (Get-Command python).Source
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DNSS_HWY_TARGET_MODE=dynamic -DNSS_GIT_DESCRIBE="$env:PKG_LABEL" -DVapourSynth_INCLUDE_DIR="$vsInclude" -DPython3_EXECUTABLE="$pythonExe"
      - name: build
        run: cmake --build build -j
      - name: verify Python oracle environment
        run: python -c "import numpy, scipy; print('numpy', numpy.__version__, 'scipy', scipy.__version__)"
      - name: unit tests
        run: ctest --test-dir build --output-on-failure
      - name: plugin gate must execute
        run: |
          ctest --test-dir build -R '^test_full_image_plugin$' -V | Tee-Object -FilePath full-image.log
          if (-not (Select-String -Path full-image.log -Pattern 'NSS_GATE_COMPLETED.*"passed": true' -Quiet)) {
            throw "test_full_image_plugin did not run to a pass"
          }
      - name: host smoke (default + temporal + explicit parameters)
        run: python tests/smoke_defaults.py
        env:
          NSS_SO: ${{ github.workspace }}\build\libnss.dll
      - name: parameter bounds probe
        run: python tests/test_parameter_bounds_plugin.py
        env:
          NSS_SO: ${{ github.workspace }}\build\libnss.dll
      - name: package
        run: |
          $pkg = "nssfactory-${env:PKG_LABEL}-windows-x86_64"
          New-Item -ItemType Directory "pkg/$pkg/docs" | Out-Null
          Copy-Item build\libnss.dll, README.md, LICENSE, NOTICE "pkg/$pkg/"
          Copy-Item -Recurse docs\api "pkg/$pkg/docs/"
          tar -C pkg -a -c -f "$pkg.zip" "$pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: nssfactory-*-windows-x86_64.zip
          if-no-files-found: error

  # CUDA plugin: built with the release toolkit (13.3: native cubins for
  # sm_75/86/89/120 plus compute_75 PTX), CUDA runtime linked statically.
  # The packages need an NVIDIA driver of the r580 branch or newer.
  build-linux-cuda:
    runs-on: ubuntu-latest
    container: nvidia/cuda:13.3.0-devel-ubuntu24.04
    env:  # no ccache in the toolkit image
      CMAKE_C_COMPILER_LAUNCHER: ""
      CMAKE_CXX_COMPILER_LAUNCHER: ""
    steps:
      - name: packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git python3 python3-venv ca-certificates
          python3 -m venv /opt/venv
          /opt/venv/bin/pip install cmake ninja vapoursynth
          # Headers only: the plugin is loaded by the host and never links libvapoursynth.
          git clone --depth 1 --branch R80 https://github.com/vapoursynth/vapoursynth /opt/vapoursynth
      - uses: actions/checkout@v4
      - name: package label
        shell: bash
        run: echo "PKG_LABEL=${PKG_LABEL:-${GITHUB_SHA::7}}" >> "$GITHUB_ENV"
      - name: configure
        run: |
          export PATH=/opt/venv/bin:$PATH
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DNSS_ENABLE_CUDA=ON -DNSS_BUILD_CPU=OFF \
            -DNSS_GIT_DESCRIBE="$PKG_LABEL" \
            -DVapourSynth_INCLUDE_DIR=/opt/vapoursynth/include \
            -DPython3_EXECUTABLE=/opt/venv/bin/python
      - name: build
        run: /opt/venv/bin/cmake --build build -j
      - name: fat binary contents
        run: |
          cuobjdump --list-elf --list-ptx build/src/cuda/libnss_cuda.so | tee fatbin.txt
          for arch in sm_75 sm_86 sm_89 sm_120; do grep -q "\.${arch}\.cubin" fatbin.txt || { echo "missing $arch cubin"; exit 1; }; done
          grep -q "\.sm_75\.ptx" fatbin.txt || { echo "missing compute_75 PTX"; exit 1; }
      - name: "cuda tests (no GPU: load, signatures, creation errors)"
        run: /opt/venv/bin/ctest --test-dir build -L cuda --output-on-failure
      - name: package
        run: |
          pkg="nssfactory-${PKG_LABEL}-linux-x86_64-cuda"
          mkdir -p "pkg/$pkg/docs"
          cp build/src/cuda/libnss_cuda.so README.md LICENSE NOTICE "pkg/$pkg/"
          cp -r docs/api "pkg/$pkg/docs/"
          tar -C pkg -czf "$pkg.tar.gz" "$pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-cuda
          path: nssfactory-*-linux-x86_64-cuda.tar.gz
          if-no-files-found: error

  build-windows-cuda:
    # Pinned to VS 2022, which CUDA 13.3 supports; windows-latest ships VS 2026.
    runs-on: windows-2022
    env:  # no ccache on this runner image
      CMAKE_C_COMPILER_LAUNCHER: ""
      CMAKE_CXX_COMPILER_LAUNCHER: ""
    steps:
      - uses: actions/checkout@v4
      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "13.3.0"
          method: network
          # CUDA 13 ships the crt headers and NVVM as packages of their own.
          sub-packages: '["nvcc", "crt", "nvvm", "cudart", "cuobjdump", "nvtx", "visual_studio_integration"]'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: packages
        run: pip install vapoursynth ninja
      - name: package label
        shell: bash
        run: echo "PKG_LABEL=${PKG_LABEL:-${GITHUB_SHA::7}}" >> "$GITHUB_ENV"
      - name: configure
        run: |
          $vsInclude = python -c "import vapoursynth, pathlib; print(pathlib.Path(vapoursynth.__file__).parent / 'include')"
          $pythonExe = (Get-Command python).Source
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl -DNSS_ENABLE_CUDA=ON -DNSS_BUILD_CPU=OFF -DNSS_GIT_DESCRIBE="$env:PKG_LABEL" -DVapourSynth_INCLUDE_DIR="$vsInclude" -DPython3_EXECUTABLE="$pythonExe"
      - name: build
        run: cmake --build build -j
      - name: "cuda tests (no GPU: load, signatures, creation errors)"
        run: ctest --test-dir build -L cuda --output-on-failure
      - name: package
        run: |
          $dll = Get-ChildItem -Recurse build -Filter libnss_cuda.dll | Select-Object -First 1
          if (-not $dll) { throw "libnss_cuda.dll was not produced" }
          cuobjdump --list-elf --list-ptx $dll.FullName
          $pkg = "nssfactory-${env:PKG_LABEL}-windows-x86_64-cuda"
          New-Item -ItemType Directory "pkg/$pkg/docs" | Out-Null
          Copy-Item $dll.FullName, README.md, LICENSE, NOTICE "pkg/$pkg/"
          Copy-Item -Recurse docs\api "pkg/$pkg/docs/"
          tar -C pkg -a -c -f "$pkg.zip" "$pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-cuda
          path: nssfactory-*-windows-x86_64-cuda.zip
          if-no-files-found: error

  # Vulkan plugin (docs/vulkan-plan.md): packaged for testing only. draft-release
  # does not attach these until phase V12.
  build-linux-vk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: release-ccache-linux-vk-${{ github.sha }}
          restore-keys: release-ccache-linux-vk-
      - name: packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git ccache python3-venv g++
          python3 -m venv .vsenv
          .vsenv/bin/pip install vapoursynth
          echo "VapourSynth_INCLUDE_DIR=$(.vsenv/bin/python -c "import vapoursynth, pathlib; print(pathlib.Path(vapoursynth.__file__).parent / 'include')")" >> "$GITHUB_ENV"
      - name: package label
        run: echo "PKG_LABEL=${PKG_LABEL:-${GITHUB_SHA::7}}" >> "$GITHUB_ENV"
      - name: configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DNSS_ENABLE_VULKAN=ON -DNSS_BUILD_CPU=OFF \
            -DNSS_GIT_DESCRIBE="$PKG_LABEL" \
            -DVapourSynth_INCLUDE_DIR="$VapourSynth_INCLUDE_DIR" \
            -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.vsenv/bin/python"
      - name: build
        run: cmake --build build -j
      - name: "vk tests (no device: classification, load, signatures)"
        run: ctest --test-dir build -L vk --output-on-failure
      - name: package
        run: |
          pkg="nssfactory-${PKG_LABEL}-linux-x86_64-vk"
          mkdir -p "pkg/$pkg"
          cp build/src/vulkan/libnss_vk.so README.md LICENSE NOTICE "pkg/$pkg/"
          tar -C pkg -czf "$pkg.tar.gz" "$pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-vk
          path: nssfactory-*-linux-x86_64-vk.tar.gz
          if-no-files-found: error

  build-windows-vk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: release-ccache-windows-vk-${{ github.sha }}
          restore-keys: release-ccache-windows-vk-
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: packages
        run: |
          choco install ccache llvm ninja --no-progress
          pip install vapoursynth
      - name: package label
        shell: bash
        run: echo "PKG_LABEL=${PKG_LABEL:-${GITHUB_SHA::7}}" >> "$GITHUB_ENV"
      - name: configure
        run: |
          $vsInclude = python -c "import vapoursynth, pathlib; print(pathlib.Path(vapoursynth.__file__).parent / 'include')"
          $pythonExe = (Get-Command python).Source
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DNSS_ENABLE_VULKAN=ON -DNSS_BUILD_CPU=OFF -DNSS_GIT_DESCRIBE="$env:PKG_LABEL" -DVapourSynth_INCLUDE_DIR="$vsInclude" -DPython3_EXECUTABLE="$pythonExe"
      - name: build
        run: cmake --build build -j
      - name: "vk tests (no device: classification, load, signatures)"
        run: ctest --test-dir build -L vk --output-on-failure
      - name: package
        run: |
          $dll = Get-ChildItem -Recurse build -Filter libnss_vk.dll | Select-Object -First 1
          if (-not $dll) { throw "libnss_vk.dll was not produced" }
          $pkg = "nssfactory-${env:PKG_LABEL}-windows-x86_64-vk"
          New-Item -ItemType Directory "pkg/$pkg" | Out-Null
          Copy-Item $dll.FullName, README.md, LICENSE, NOTICE "pkg/$pkg/"
          tar -C pkg -a -c -f "$pkg.zip" "$pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-vk
          path: nssfactory-*-windows-x86_64-vk.zip
          if-no-files-found: error
