name: draft-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. r4); created on the default branch if missing'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # The packages come from the package workflow, named after the tag.
  package:
    uses: ./.github/workflows/package.yml
    with:
      label: ${{ inputs.tag }}
    permissions:
      contents: read

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag }}" --draft --target "${{ github.sha }}" --generate-notes \
            dist/linux-x86_64/*.tar.gz dist/macos-arm64/*.tar.gz dist/windows-x86_64/*.zip \
            dist/linux-x86_64-cuda/*.tar.gz dist/windows-x86_64-cuda/*.zip
