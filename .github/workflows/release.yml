# SPDX-License-Identifier: GPL-2.0-only
name: draft-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. r4); created on the default branch if missing'
        required: true
        type: string

permissions:
  contents: write

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: release-ccache-linux-${{ github.sha }}
          restore-keys: release-ccache-linux-
      - name: packages
        run: sudo apt-get update && sudo apt-get install -y cmake g++ git curl ccache
      - name: VapourSynth host (wheel bundles core DLLs and API4 headers)
        run: |
          pip install vapoursynth numpy
          echo "VapourSynth_INCLUDE_DIR=$(python3 -c "import vapoursynth, pathlib; print(pathlib.Path(vapoursynth.__file__).parent / 'include')")" >> "$GITHUB_ENV"
      - name: configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DNSS_HWY_TARGET_MODE=dynamic
      - name: build
        run: cmake --build build -j
      - name: unit tests
        run: ctest --test-dir build --output-on-failure
      - name: host smoke (default + temporal + explicit parameters)
        run: python3 tests/smoke_defaults.py
        env:
          NSS_SO: ${{ github.workspace }}/build/libnss.so
      - name: parameter bounds probe
        run: python3 tests/test_parameter_bounds_plugin.py
        env:
          NSS_SO: ${{ github.workspace }}/build/libnss.so
      - name: package
        run: |
          test -f build/libnss.so
          pkg="nssfactory-${{ inputs.tag }}-linux-x86_64"
          mkdir -p "pkg/$pkg"
          cp build/libnss.so README.md LICENSE NOTICE "pkg/$pkg/"
          tar -C pkg -czf "$pkg.tar.gz" "$pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: nssfactory-${{ inputs.tag }}-linux-x86_64.tar.gz
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: release-ccache-macos-${{ github.sha }}
          restore-keys: release-ccache-macos-
      - name: packages
        run: |
          brew install ccache
          python3 -m venv .vsenv
          .vsenv/bin/pip install vapoursynth numpy
          echo "VapourSynth_INCLUDE_DIR=$(.vsenv/bin/python3 -c "import vapoursynth, pathlib; print(pathlib.Path(vapoursynth.__file__).parent / 'include')")" >> "$GITHUB_ENV"
      - name: configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DNSS_HWY_TARGET_MODE=neon
      - name: build
        run: cmake --build build -j
      - name: unit tests
        run: ctest --test-dir build --output-on-failure
      - name: host smoke (default + temporal + explicit parameters)
        run: .vsenv/bin/python3 tests/smoke_defaults.py
        env:
          NSS_SO: ${{ github.workspace }}/build/libnss.dylib
      - name: parameter bounds probe
        run: .vsenv/bin/python3 tests/test_parameter_bounds_plugin.py
        env:
          NSS_SO: ${{ github.workspace }}/build/libnss.dylib
      - name: package
        run: |
          test -f build/libnss.dylib
          pkg="nssfactory-${{ inputs.tag }}-macos-arm64"
          mkdir -p "pkg/$pkg"
          cp build/libnss.dylib README.md LICENSE NOTICE "pkg/$pkg/"
          tar -C pkg -czf "$pkg.tar.gz" "$pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: nssfactory-${{ inputs.tag }}-macos-arm64.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: release-ccache-windows-${{ github.sha }}
          restore-keys: release-ccache-windows-
      - name: packages
        run: |
          choco install ccache --no-progress
          pip install vapoursynth numpy scipy
      - name: configure
        run: |
          $vsInclude = python -c "import vapoursynth, pathlib; print(pathlib.Path(vapoursynth.__file__).parent / 'include')"
          $pythonExe = (Get-Command python).Source
          cmake -S . -B build -A x64 -T ClangCL -DCMAKE_BUILD_TYPE=Release -DNSS_HWY_TARGET_MODE=dynamic -DVapourSynth_INCLUDE_DIR="$vsInclude" -DPython3_EXECUTABLE="$pythonExe"
      - name: build
        run: cmake --build build --config Release -j
      - name: verify Python oracle environment
        run: python -c "import numpy, scipy; print('numpy', numpy.__version__, 'scipy', scipy.__version__)"
      - name: unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: host smoke (default + temporal + explicit parameters)
        run: python tests/smoke_defaults.py
        env:
          NSS_SO: ${{ github.workspace }}\build\Release\libnss.dll
      - name: parameter bounds probe
        run: python tests/test_parameter_bounds_plugin.py
        env:
          NSS_SO: ${{ github.workspace }}\build\Release\libnss.dll
      - name: package
        run: |
          $pkg = "nssfactory-${{ inputs.tag }}-windows-x86_64"
          New-Item -ItemType Directory "pkg/$pkg" | Out-Null
          Copy-Item build\Release\libnss.dll, README.md, LICENSE, NOTICE "pkg/$pkg/"
          tar -C pkg -a -c -f "$pkg.zip" "$pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: nssfactory-${{ inputs.tag }}-windows-x86_64.zip
          if-no-files-found: error

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag }}" --draft --target "${{ github.sha }}" --generate-notes \
            dist/linux-x86_64/*.tar.gz dist/macos-arm64/*.tar.gz dist/windows-x86_64/*.zip
